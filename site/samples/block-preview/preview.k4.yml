kamishibai: '4.0'
controls:
  keymaps:
    production: {Space: navigation.nextAction}
assets:
  Studio: backdrop
  BubbleStudio: backdrop
  HeroIdle: costume:Hero
  HeroHappy: costume:Hero
actors:
  Hero: HeroIdle
bubbleStyles:
  typewriter:
    reveal: {unit: CHARACTER, intervalSeconds: 0.045}
    showAnimation: {name: fadeIn, durationSeconds: 0.4}
    hideAnimation: {name: fadeOut, durationSeconds: 0.2}
  pop:
    reveal: {unit: WORD, intervalSeconds: 0.16}
    showAnimation: {name: zoomIn, durationSeconds: 0.45}
    hideAnimation: {name: fadeOut, durationSeconds: 0.2}
scenes:
  01 配置と動き:
    - stage: Studio
    - Hero.show: {skin: HeroIdle, x: -120, y: -35, scale: 90}
    - Hero.moveTo: {x: 100, y: -35, seconds: 1.6, easing: easeInOut}
    - Hero.setSkin: {skin: HeroHappy, scale: 110}
    - Hero.moveTo: {x: -20, y: 20, seconds: 1.4, easing: linear}
    - wait: 0.5
  02 吹き出し:
    - stage: BubbleStudio
    - Hero.show: {skin: HeroHappy, x: -70, y: -40, scale: 100}
    - Hero.say: {text: '文字とスタイルを変えると、すぐに再生します。', seconds: 3, styles: [typewriter]}
    - Hero.think: {text: '表示アニメーションも確かめよう。', seconds: 3, styles: [pop]}
    - Hero.say: {text: 'こちらは文章と秒数だけの、簡単な吹き出し。', seconds: 2.5}
    - Hero.think: {text: '心の声も、その場で変更できます。', seconds: 2.5}
    - wait: 0.5
