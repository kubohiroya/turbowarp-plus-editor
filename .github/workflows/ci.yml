name: CI
on:
  # A pull request branch is covered by the pull_request event alone. Without this filter a push
  # to such a branch ran the whole job twice on the same commit, which doubled every PR's CI.
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_revision:
        type: string
        required: true
permissions:
  contents: read
  # Read-only, to find the pull request run that already verified a merged tree.
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  # main must not be cancelled: Publish is chained to each main CI completing, and cancelling one
  # would leave that commit undeployed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TW_PLUS_CI_SCOPED: ${{ vars.TW_PLUS_CI_SCOPED }}
      E2E_EXPECT_SITE_REVISION: ${{ inputs.release_revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_revision || github.sha }}
      - name: Confirm the stable release checkout
        if: inputs.release_revision != ''
        env:
          CI_RELEASE_REVISION: ${{ inputs.release_revision }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$CI_RELEASE_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CI_RELEASE_REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record proposed verification plan
        continue-on-error: true
        run: node scripts/ci/verification-plan.ts
      - name: Select verification to execute
        id: scope
        if: env.TW_PLUS_CI_SCOPED == '1' && inputs.release_revision == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verification-execution.ts
      - name: Check documentation diff
        id: documentation
        if: steps.scope.outputs.mode == 'scoped' && contains(steps.scope.outputs.checks, '|documentation|')
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: git diff --check "$BASE" HEAD --
      - name: Prepare pnpm for the security package's Git install
        if: steps.scope.outputs.mode != 'scoped' || steps.scope.outputs.npm == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.8
      - if: steps.scope.outputs.mode != 'scoped' || steps.scope.outputs.npm == 'true'
        run: |
          TWEXTSEC_SOURCE_REVISION=$(node -p "require('./site/source.json').securityRevision || ''") npm ci
      - run: npm run typecheck
        id: typecheck
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|typecheck|')
      - run: npm run test:package
        id: package-tests
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|package|')
      - run: npm test
        id: unit-tests
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|unit|')
      - run: npm run test:e2e:infrastructure
        id: infrastructure-tests
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|infrastructure|')
      - run: node --test 'packages/editor-views/test/**/*.test.ts'
        id: views-unit
        if: (inputs.release_revision != '' || env.TW_PLUS_CI_SCOPED == '1') && (steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|views-unit|'))
      - run: node --test 'packages/editor-backpack/test/**/*.test.ts'
        id: backpack-unit
        if: (inputs.release_revision != '' || env.TW_PLUS_CI_SCOPED == '1') && (steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|backpack-unit|'))
      - name: Record per-check reuse candidates
        if: github.event_name == 'push' && inputs.release_revision == '' && env.TW_PLUS_CI_SCOPED != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verification-evidence.ts inspect
      - name: Read immutable integration sources
        id: source
        if: steps.scope.outputs.mode != 'scoped' || steps.scope.outputs.gui == 'true'
        run: node scripts/site/source.ts
      - uses: actions/checkout@v4
        if: steps.scope.outputs.mode != 'scoped' || steps.scope.outputs.gui == 'true'
        with:
          repository: kubohiroya/scratch-gui
          ref: ${{ steps.source.outputs.guiRevision }}
          path: .host/scratch-gui
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|site-build|')
        with:
          repository: ${{ steps.source.outputs.packagerRepository }}
          ref: ${{ steps.source.outputs.packagerRevision }}
          path: .host/packager
          persist-credentials: false
      - name: Restore the pinned host's modules
        id: host-modules
        if: steps.scope.outputs.mode != 'scoped' || steps.scope.outputs.gui == 'true'
        uses: actions/cache@v4
        with:
          path: .host/scratch-gui/node_modules
          # Keyed on the lockfile alone, because that is what decides this tree: the step below
          # installs it with `npm ci`, which reads nothing else. The GUI revision used to be in the
          # key as well, and this repository changes that revision in most of its pull requests —
          # so the key changed while the lockfile had not, every such run missed and paid a two
          # minute install, and each one left another copy behind (20 of them, 1.45 GiB, in a
          # repository already at 9.71 GiB of its 10 GiB, where the overflow evicts other caches).
          #
          # The core pin is not in the key either: the GUI no longer depends on that package at
          # all, so nothing in this tree carries it and `verifyInstalledCore` checks the copy this
          # repository installs instead. `prepublish.mjs` still runs below on a hit, because what
          # it writes is outside node_modules.
          #
          # No `restore-keys`: a fallback hit leaves `cache-hit` false, so `npm ci` runs anyway and
          # deletes the tree that was just restored — paying for the download to throw it away.
          key: host-modules-${{ runner.os }}-${{ hashFiles('.host/scratch-gui/package-lock.json') }}
      - name: Install the pinned host dependencies
        if: steps.scope.outputs.mode != 'scoped' || steps.scope.outputs.gui == 'true'
        working-directory: .host/scratch-gui
        run: |
          if [ "${{ steps.host-modules.outputs.cache-hit }}" != "true" ]; then
            npm ci --no-audit --no-fund
          fi
          # prepublish writes static/microbit and src/generated, which are outside node_modules,
          # so it runs whether or not the modules came from the cache.
          node scripts/prepublish.mjs
          # test:gui-integration compares the pinned GUI's files with the upstream revision it was
          # moved from (docs/gui-integration/relocation.json), so that commit must be in the checkout.
          git fetch --no-tags --depth=1 https://github.com/TurboWarp/scratch-gui.git 3c017c528c853af3111df9641914704745c1fdf6
      # The extension host is supplied from here, but what it installs on is the pinned GUI's VM,
      # and the registration it drives must use that VM's own modules. So these run against the
      # checkout above rather than this repository's dependencies, and only once it is prepared.
      - run: npm run test:extension-host
        id: extension-host
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|extension-host|')
        env:
          E2E_GUI_ROOT: ${{ github.workspace }}/.host/scratch-gui
      - run: npm run test:gui-integration
        id: gui-integration
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|gui-integration|')
        env:
          E2E_GUI_ROOT: ${{ github.workspace }}/.host/scratch-gui
      - run: npm run test:script-transfer
        id: script-transfer
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|script-transfer|')
        env:
          E2E_GUI_ROOT: ${{ github.workspace }}/.host/scratch-gui
      - run: npm run test:project-tools
        id: project-tools
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|project-tools|')
        env:
          E2E_GUI_ROOT: ${{ github.workspace }}/.host/scratch-gui
      - name: Build TurboWarp-Plus-Editor
        id: site-build
        if: steps.scope.outputs.mode != 'scoped' || contains(steps.scope.outputs.checks, '|site-build|')
        env:
          E2E_GUI_ROOT: ${{ github.workspace }}/.host/scratch-gui
          TW_PLUS_PACKAGER_ROOT: ${{ github.workspace }}/.host/packager
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build:pages
      - name: Require all selected verification to pass
        if: ${{ !cancelled() && (inputs.release_revision != '' || env.TW_PLUS_CI_SCOPED == '1') }}
        env:
          CI_RELEASE_REVISION: ${{ inputs.release_revision }}
          CI_EXECUTION_MODE: ${{ steps.scope.outputs.mode }}
          CI_REQUIRED_CHECKS: ${{ steps.scope.outputs.checks }}
          CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/ci/verification-execution.ts verify
      - name: Record successful verification items
        id: verification-evidence
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          CI_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: node scripts/ci/verification-evidence.ts record
      - uses: actions/upload-artifact@v4
        if: success() && steps.verification-evidence.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ steps.verification-evidence.outputs.artifact }}
          path: ${{ runner.temp }}/verification-evidence.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && steps.site-build.outcome == 'success'
        with:
          name: editor-site-${{ github.sha }}-${{ github.run_attempt }}
          path: .host/scratch-gui/build/
          retention-days: 7
          if-no-files-found: error
